<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financeiro Pessoal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- TOP BAR -->
  <header id="topbar">
    <h1>💰 Financeiro</h1>
    <button class="btn-novo" onclick="Modal.open()">+ Novo Lançamento</button>
  </header>

  <!-- CONTENT -->
  <div id="content"></div>

  <!-- LOADING -->
  <div id="loading">
    <div class="spinner"></div>
  </div>

  <!-- TOAST -->
  <div id="toast"></div>

  <!-- MODAL -->
  <div id="modalBackdrop" class="modal-backdrop hidden" onclick="if(event.target===this)Modal.close()">
    <div class="modal-box">
      <h3 id="modalTitle">Novo Lançamento</h3>

      <!-- Tipo -->
      <div class="form-group">
        <label>Tipo</label>
        <div class="tipo-toggle">
          <button id="btnTipoPagar"   class="active-pagar"   onclick="Modal.setTipo('pagar')">↑ A Pagar</button>
          <button id="btnTipoReceber" onclick="Modal.setTipo('receber')">↓ A Receber</button>
        </div>
      </div>

      <div class="form-row">
        <!-- Empresa -->
        <div class="form-group">
          <label>Empresa / Origem</label>
          <select id="fEmpresa" onchange="Modal._updateCats()">
            <!-- preenchido pelo JS -->
          </select>
        </div>
        <!-- Categoria -->
        <div class="form-group">
          <label>Categoria</label>
          <select id="fCategoria">
            <!-- preenchido pelo JS -->
          </select>
        </div>
      </div>

      <!-- Descrição -->
      <div class="form-group">
        <label>Descrição *</label>
        <input type="text" id="fDescricao" placeholder="Ex: Conta de água, Salário, NF...">
      </div>

      <!-- Parceiro -->
      <div class="form-group" id="fParceiro">
        <label>Fornecedor</label>
        <input type="text" placeholder="Nome do fornecedor ou cliente">
      </div>

      <div class="form-row">
        <!-- Valor -->
        <div class="form-group">
          <label>Valor (R$) *</label>
          <input type="number" id="fValor" placeholder="0,00" min="0" step="0.01">
        </div>
        <!-- Status -->
        <div class="form-group">
          <label>Status</label>
          <select id="fStatus">
            <!-- preenchido pelo JS -->
          </select>
        </div>
      </div>

      <div class="form-row">
        <!-- Vencimento -->
        <div class="form-group">
          <label>Vencimento *</label>
          <input type="date" id="fVencimento">
        </div>
        <!-- Pagamento efetivo -->
        <div class="form-group">
          <label>Data de Pagamento</label>
          <input type="date" id="fPagamento">
        </div>
      </div>

      <!-- Observação -->
      <div class="form-group">
        <label>Observação</label>
        <textarea id="fObs" rows="2" placeholder="Opcional..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn-delete" id="btnDelete" onclick="Modal.del()" style="display:none">Excluir</button>
        <button class="btn-cancel" onclick="Modal.close()">Cancelar</button>
        <button class="btn-save"   onclick="Modal.save()">Salvar</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/config.js?v=20261112a"></script>
  <script src="js/api.js?v=20261112a"></script>
  <script src="js/app.js?v=20261112a"></script>

  <script>
    // Preenche select de empresas no modal
    document.addEventListener('DOMContentLoaded', () => {
      const sel = document.getElementById('fEmpresa');
      sel.innerHTML = CONFIG.empresas.map(e => `<option value="${e}">${e}</option>`).join('');
    });
  </script>
</body>
</html>
